aid: shopventory
name: Shopventory
description: >-
  Thrive by Shopventory is inventory management, catalog control, and reporting
  software for small and medium-sized retail, restaurant, and hospitality
  businesses. Founded in 2012 out of a San Diego boutique and a graduate of the
  Techstars Boulder accelerator, Shopventory syncs stock, sales, and cost-of-goods
  data across multiple locations and sales channels, and integrates with Square,
  Shopify, Clover, BigCommerce, WooCommerce, and QuickBooks Online. The platform
  offers barcode scanning, purchase-order automation, demand forecasting, bundles
  and component-level tracking, price-tag printing, and advanced custom reporting.
  The company operates as Thrive by Shopventory (thrivemetrics.com). Its former
  public developer API (apidocs.shopventory.com) is no longer resolvable, so this
  profile captures the company's live web, support, and integration surface plus
  probed domain-security posture rather than a public API specification.
